services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniloan
      POSTGRES_USER: miniloan
      POSTGRES_PASSWORD: miniloan_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniloan -d miniloan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=miniloan;Username=miniloan;Password=miniloan_dev"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
