services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miniloan
      POSTGRES_USER: miniloan
      POSTGRES_PASSWORD: miniloan_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniloan -d miniloan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/miniloan"
      SPRING_DATASOURCE_USERNAME: "miniloan"
      SPRING_DATASOURCE_PASSWORD: "miniloan_dev"
      SERVER_PORT: "8080"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        API_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
