<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/colors.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/typography.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/styles.css">
  <script src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--bg-page);font-family:var(--font-ui),'IBM Plex Sans Thai',sans-serif;}
    a{color:var(--brand-primary-strong,#175CD3);text-decoration:none}
    a:hover{color:var(--brand-primary)}
    .mlq-skel{background:var(--gray-200);border-radius:var(--radius-sm,6px)}
    .mlq-scroll{max-height:520px;overflow-y:auto}
    .mlq-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
    .mlq-row:last-child{border-bottom:none}
    .mlq-label{font-size:13px;color:var(--text-secondary)}
    .mlq-value{font-size:14px;color:var(--text-primary);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  </style>
</helmet>

<div style="min-height:100vh" data-screen-label="UI-miniloan-004">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--bg-surface);border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/assets/logo/miniloan-icon.svg" style="height:28px">
      <img src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/assets/logo/miniloan-wordmark.svg" style="height:18px">
    </div>
    <div style="display:flex;align-items:center;gap:16px;font-size:14px;color:var(--text-secondary)">
      <span>สมชาย ใจดี</span>
      <div style="width:32px;height:32px;border-radius:999px;background:var(--brand-subtle);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">สจ</div>
    </div>
  </div>

  <div style="max-width:960px;margin:0 auto;padding:32px 24px 80px">
    <h1 style="font-size:22px;font-weight:700;color:var(--text-primary);margin:0 0 20px">ตารางผ่อนชำระของฉัน</h1>

    <sc-if value="{{isUnauthorized}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 24px;text-align:center;border-radius:var(--radius-lg,14px);background:var(--bg-surface);border:1px solid var(--border)">
        <div style="font-size:15px;color:var(--text-primary)">คุณไม่มีสิทธิ์ดูตารางผ่อนของบัญชีนี้</div>
      </div>
    </sc-if>

    <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 24px;text-align:center;border-radius:var(--radius-lg,14px);background:var(--bg-surface);border:1px solid var(--border)">
        <div style="font-size:15px;color:var(--danger)">โหลดตารางไม่สำเร็จ</div>
        <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" on-click="{{onRetry}}" hint-size="auto,40px">ลองใหม่</x-import>
      </div>
    </sc-if>

    <sc-if value="{{showContent}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:24px">

        <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Card" padding="0" hint-size="100%,auto">
          <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
            <div style="display:flex;flex-direction:column;gap:12px;padding:16px">
              <div class="mlq-skel" style="height:20px;width:100%"></div>
              <div class="mlq-skel" style="height:20px;width:100%"></div>
              <div class="mlq-skel" style="height:20px;width:100%"></div>
              <div class="mlq-skel" style="height:20px;width:100%"></div>
              <div class="mlq-skel" style="height:20px;width:100%"></div>
            </div>
          </sc-if>
          <sc-if value="{{showFields}}" hint-placeholder-val="{{true}}">
            <div class="mlq-scroll">
              <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Table" columns="{{scheduleColumns}}" rows="{{scheduleRows}}" hint-size="100%,auto"></x-import>
            </div>
          </sc-if>
        </x-import>

        <sc-if value="{{showFields}}" hint-placeholder-val="{{true}}">
          <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Card" hint-size="100%,auto">
            <div class="mlq-row">
              <div class="mlq-label">เงินต้นรวมทั้งตาราง</div>
              <div class="mlq-value" data-testid="ui-miniloan-004-ent-007-total-principal">{{totalPrincipal}} บาท</div>
            </div>
            <div style="display:flex;justify-content:flex-end;padding-top:16px">
              <div data-testid="ui-miniloan-004-request-payoff-quote">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" on-click="{{onRequestPayoff}}" hint-size="auto,40px">ขอยอดปิดบัญชีก่อนกำหนด</x-import>
              </div>
            </div>
          </x-import>
        </sc-if>

      </div>
    </sc-if>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1000, &quot;height&quot;: 900},
  &quot;demoState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;loading&quot;, &quot;error&quot;, &quot;unauthorized&quot;, &quot;overflow&quot;], &quot;section&quot;: &quot;Demo state&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    const demoState = this.props.demoState ?? 'normal';
    const isLoading = demoState === 'loading';
    const isError = demoState === 'error';
    const isUnauthorized = demoState === 'unauthorized';
    const showContent = !isLoading && !isError && !isUnauthorized;
    const showFields = !isLoading;
    const rowCount = demoState === 'overflow' ? 36 : 12;

    const statusPill = (status) => {
      const map = {
        Paid: { bg: 'var(--success-bg)', fg: 'var(--success)', label: 'ชำระแล้ว' },
        Due: { bg: 'var(--gray-100)', fg: 'var(--gray-600)', label: 'ยังไม่ครบกำหนด' },
        Overdue: { bg: 'var(--danger-bg)', fg: 'var(--danger)', label: 'เกินกำหนด' },
      };
      const c = map[status] || map.Due;
      return React.createElement('span', {
        style: { display: 'inline-block', background: c.bg, color: c.fg, fontSize: 12, fontWeight: 600, padding: '3px 9px', borderRadius: 'var(--radius-sm)' }
      }, c.label);
    };
    const testCell = (testid, node) => React.createElement('div', { 'data-testid': testid, style: { textAlign: 'right' } }, node);

    const principal = 80000;
    const termMonths = 12;
    const annualRate = 0.14;
    const monthlyRate = annualRate / 12;
    const emi = Math.round(principal * monthlyRate / (1 - Math.pow(1 + monthlyRate, -termMonths)));
    const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const fmt = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    let balance = principal;
    const today = new Date(2569 - 543, 6, 2);
    const schedule = [];
    for (let i = 1; i <= rowCount; i++) {
      const interest = balance * monthlyRate;
      const principalPortion = Math.min(emi - interest, balance);
      const dueDate = new Date(today);
      dueDate.setMonth(dueDate.getMonth() + i);
      balance = Math.max(0, balance - principalPortion);
      const status = i <= 2 ? 'Paid' : (i === 3 ? 'Overdue' : 'Due');
      schedule.push({
        n: i,
        due: `1 ${months[dueDate.getMonth()]} ${dueDate.getFullYear() + 543}`,
        emi: fmt(emi),
        interest: fmt(interest),
        principalPortion: fmt(principalPortion),
        balance: fmt(balance),
        status,
      });
    }

    const scheduleColumns = [
      { key: 'n', label: 'งวดที่', align: 'left' },
      { key: 'due', label: 'วันครบกำหนด' },
      { key: 'emi', label: 'ค่างวด (EMI)', align: 'right' },
      { key: 'interest', label: 'ส่วนดอกเบี้ย', align: 'right' },
      { key: 'principalPortion', label: 'ส่วนเงินต้น', align: 'right' },
      { key: 'balance', label: 'ยอดคงเหลือ', align: 'right' },
      { key: 'status', label: 'สถานะงวด', align: 'right' },
    ];
    const scheduleRows = schedule.map(r => ({
      n: testCell('ui-miniloan-004-ent-008-installment-number', r.n),
      due: testCell('ui-miniloan-004-ent-008-due-date', r.due),
      emi: testCell('ui-miniloan-004-ent-008-emi-amount', r.emi),
      interest: testCell('ui-miniloan-004-ent-008-interest-portion', r.interest),
      principalPortion: testCell('ui-miniloan-004-ent-008-principal-portion', r.principalPortion),
      balance: testCell('ui-miniloan-004-ent-008-remaining-balance', r.balance),
      status: testCell('ui-miniloan-004-ent-008-status', statusPill(r.status)),
    }));

    return {
      isLoading, isError, isUnauthorized, showContent, showFields,
      scheduleColumns, scheduleRows,
      totalPrincipal: fmt(principal),
      onRetry: () => this.forceUpdate(),
      onRequestPayoff: () => {},
    };
  }
}
</script>
</body>
</html>
