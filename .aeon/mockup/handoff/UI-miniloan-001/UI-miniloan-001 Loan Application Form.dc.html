<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/colors.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/typography.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/styles.css">
  <script src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--bg-page);font-family:var(--font-ui),'IBM Plex Sans Thai',sans-serif;}
    a{color:var(--brand-primary-strong,#175CD3);text-decoration:none}
    a:hover{color:var(--brand-primary)}
    .mlq-skel{background:var(--gray-200);border-radius:var(--radius-sm,6px)}
  </style>
</helmet>

<div style="min-height:100vh" data-screen-label="UI-miniloan-001">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--bg-surface);border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/assets/logo/miniloan-icon.svg" style="height:28px">
      <img src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/assets/logo/miniloan-wordmark.svg" style="height:18px">
    </div>
    <div style="display:flex;align-items:center;gap:16px;font-size:14px;color:var(--text-secondary)">
      <span>สมชาย ใจดี</span>
      <div style="width:32px;height:32px;border-radius:999px;background:var(--brand-subtle);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">สจ</div>
    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:32px 24px 40px">
    <div style="margin-bottom:28px">
      <h1 style="font-size:24px;font-weight:700;color:var(--text-primary);margin:0 0 6px">แบบฟอร์มใบสมัครสินเชื่อ</h1>
      <p style="font-size:14px;color:var(--text-secondary);margin:0">กรอกข้อมูลให้ครบถ้วนเพื่อยื่นคำขอสินเชื่อ</p>
    </div>

    <sc-if value="{{isUnauthorized}}" hint-placeholder-val="{{false}}">
      <div style="padding:64px 0;text-align:center;font-size:15px;color:var(--text-secondary)">คุณไม่มีสิทธิ์เข้าถึงหน้านี้</div>
    </sc-if>

    <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
      <div>
        <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:16px;border-radius:var(--radius);background:var(--danger-subtle,#FEF3F2);border:1px solid var(--danger)">
            <span style="font-size:14px;color:var(--danger)">เกิดข้อผิดพลาด ลองใหม่อีกครั้ง</span>
            <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" size="sm" on-click="{{onRetry}}" hint-size="auto,32px">ลองใหม่</x-import>
          </div>
        </sc-if>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="width:24px;height:24px;border-radius:999px;background:var(--brand-subtle);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0">1</div>
          <div style="font-size:15px;font-weight:700;color:var(--text-primary)">ข้อมูลส่วนตัว</div>
        </div>
        <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Card" hint-size="100%,auto">
          <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
            <div style="display:flex;flex-direction:column;gap:16px">
              <div class="mlq-skel" style="height:40px;width:100%"></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                <div class="mlq-skel" style="height:40px"></div>
                <div class="mlq-skel" style="height:40px"></div>
                <div class="mlq-skel" style="height:40px"></div>
                <div class="mlq-skel" style="height:40px"></div>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{showFields}}" hint-placeholder-val="{{true}}">
            <div style="display:flex;flex-direction:column;gap:16px">
              <div data-testid="ui-miniloan-001-ent-001-full-name">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="ชื่อผู้สมัคร" value="{{nameValue}}" error="{{nameError}}" hint-size="100%,60px"></x-import>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                <div data-testid="ui-miniloan-001-ent-002-age">
                  <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="อายุ" suffix="ปี" value="{{ageValue}}" hint-size="100%,60px"></x-import>
                </div>
                <div data-testid="ui-miniloan-001-ent-002-monthly-income">
                  <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="รายได้ต่อเดือน" suffix="บาท" value="{{incomeValue}}" hint-size="100%,60px"></x-import>
                </div>
                <div data-testid="ui-miniloan-001-ent-002-current-employment-months">
                  <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="อายุงานปัจจุบัน" suffix="เดือน" value="{{employmentValue}}" hint-size="100%,60px"></x-import>
                </div>
                <div data-testid="ui-miniloan-001-ent-002-existing-monthly-debt">
                  <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="ภาระหนี้เดิมต่อเดือน" suffix="บาท" value="{{debtValue}}" hint-size="100%,60px"></x-import>
                </div>
              </div>
            </div>
          </sc-if>
        </x-import>

        <div style="display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:24px;height:24px;border-radius:999px;background:var(--brand-subtle);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0">2</div>
            <div style="font-size:15px;font-weight:700;color:var(--text-primary)">รายละเอียดคำขอสินเชื่อ</div>
          </div>
          <div>
            <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.StatusBadge" state="Draft" hint-size="auto,24px"></x-import>
          </div>
        </div>
        <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Card" hint-size="100%,auto">
          <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div class="mlq-skel" style="height:40px"></div>
              <div class="mlq-skel" style="height:40px"></div>
            </div>
          </sc-if>
          <sc-if value="{{showFields}}" hint-placeholder-val="{{true}}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
              <div data-testid="ui-miniloan-001-ent-002-requested-amount">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="จำนวนเงินกู้ที่ขอ" suffix="บาท" value="{{amountValue}}" error="{{amountError}}" hint-size="100%,60px"></x-import>
              </div>
              <div data-testid="ui-miniloan-001-ent-002-requested-term-months">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="จำนวนงวดที่ขอ" suffix="งวด" value="{{termValue}}" error="{{termError}}" hint-size="100%,60px"></x-import>
              </div>
              <div data-testid="ui-miniloan-001-estimated-max-approved-amount" style="grid-column:1 / -1">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Input" label="วงเงินอนุมัติสูงสุดโดยประมาณ" suffix="บาท" value="{{maxApprovedValue}}" disabled="{{true}}" hint-size="100%,60px"></x-import>
              </div>
            </div>
          </sc-if>
        </x-import>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{showForm}}" hint-placeholder-val="{{true}}">
    <div style="position:sticky;bottom:0;background:var(--bg-surface);border-top:1px solid var(--border);box-shadow:var(--shadow-lg);padding:16px 24px">
      <div style="max-width:640px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end">
        <div data-testid="ui-miniloan-001-save-draft">
          <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" disabled="{{isLoading}}" on-click="{{onSaveDraft}}" hint-size="auto,40px">บันทึกร่าง</x-import>
        </div>
        <div data-testid="ui-miniloan-001-submit">
          <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="primary" disabled="{{isLoading}}" on-click="{{onSubmit}}" hint-size="auto,40px">ยื่นใบสมัคร</x-import>
        </div>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 1000},
  &quot;demoState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;loading&quot;, &quot;error&quot;, &quot;unauthorized&quot;, &quot;overflow&quot;], &quot;section&quot;: &quot;Demo state&quot;}
}">
class Component extends DCLogic {
  state = { flash: '' };

  renderVals() {
    const demoState = this.props.demoState ?? 'normal';
    const isUnauthorized = demoState === 'unauthorized';
    const isLoading = demoState === 'loading';
    const isError = demoState === 'error';
    const isOverflow = demoState === 'overflow';

    const longName = ('สมชาย ใจดี วิเศษสุขสมบูรณ์ พัฒนากิจการรุ่งเรือง '.repeat(6)).slice(0, 200);

    return {
      isUnauthorized,
      isLoading,
      isError,
      showForm: !isUnauthorized,
      showFields: !isLoading,
      nameValue: isOverflow ? longName : 'สมชาย ใจดี',
      nameError: isOverflow ? 'ชื่อยาวเกิน 200 ตัวอักษร ระบบตัดข้อความส่วนที่เกินก่อนบันทึก' : '',
      ageValue: '34',
      incomeValue: '35,000',
      employmentValue: '18',
      debtValue: '2,500',
      amountValue: isOverflow ? '2,000,000' : '150,000',
      amountError: isOverflow ? 'จำนวนเงินกู้ต้องอยู่ระหว่าง 10,000–500,000 บาท' : '',
      termValue: isOverflow ? '84' : '24',
      termError: isOverflow ? 'จำนวนงวดต้องอยู่ระหว่าง 6–60 งวด' : '',
      maxApprovedValue: '120,000',
      onRetry: () => this.forceUpdate(),
      onSaveDraft: () => { this.setState({ flash: 'draft' }); },
      onSubmit: () => { this.setState({ flash: 'submit' }); },
    };
  }
}

</script>
</body>
</html>
