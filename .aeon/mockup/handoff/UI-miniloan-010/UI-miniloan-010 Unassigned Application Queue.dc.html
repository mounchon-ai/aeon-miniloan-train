<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/colors.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/typography.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/styles.css">
  <script src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--bg-page);font-family:var(--font-ui),'IBM Plex Sans Thai',sans-serif;}
    a{color:var(--brand-primary-strong,#175CD3);text-decoration:none}
    a:hover{color:var(--brand-primary)}
    .mlq-skel{background:var(--gray-200);border-radius:var(--radius-sm,6px)}
    .mlq-navitem{padding:9px 12px;border-radius:var(--radius);font-size:14px;cursor:default}
  </style>
</helmet>

<div style="min-height:100vh;display:flex" data-screen-label="UI-miniloan-010">

  <div style="width:220px;flex-shrink:0;background:var(--bg-surface);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;padding:0 4px">
      <img src="_ds/miniloan-design-system-4cbaa06e-07fe-4bd3-9b97-0b8347149b91/assets/logo/miniloan-icon.svg" style="height:24px">
      <span style="font-weight:700;font-size:14px;font-family:var(--font-display)">MiniLoan</span>
    </div>
    <div class="mlq-navitem" style="font-weight:600;background:var(--brand-subtle);color:var(--brand-primary)">Unassigned queue</div>
    <div class="mlq-navitem" style="color:var(--text-secondary)">Assigned queue</div>
    <div class="mlq-navitem" style="color:var(--text-secondary)">Officers</div>
    <div class="mlq-navitem" style="color:var(--text-secondary)">Reports</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0">

    <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:16px 32px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:14px;color:var(--text-secondary)">
      <span>Aroon Kittiwat</span>
      <div style="width:32px;height:32px;border-radius:999px;background:var(--brand-subtle);color:var(--brand-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">AK</div>
    </div>

    <sc-if value="{{isUnauthorized}}" hint-placeholder-val="{{false}}">
      <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:32px">
        <div style="max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="font-size:15px;color:var(--text-primary)">คุณไม่มีสิทธิ์เข้าถึงหน้านี้</div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{showPage}}" hint-placeholder-val="{{true}}">
      <div style="flex:1;padding:32px;max-width:1080px">
        <h1 style="font-size:22px;font-weight:700;color:var(--text-primary);margin:0 0 20px" data-testid="ui-miniloan-010-header-title">คิวใบสมัครที่ยังไม่ถูกมอบหมาย</h1>

        <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:64px 24px;text-align:center;border-radius:var(--radius-lg,14px);background:var(--bg-surface);border:1px solid var(--border)">
            <div style="font-size:15px;color:var(--danger)">โหลดรายการไม่สำเร็จ</div>
            <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" on-click="{{onRetry}}" hint-size="auto,40px">ลองใหม่</x-import>
          </div>
        </sc-if>

        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:64px 24px;text-align:center;border-radius:var(--radius-lg,14px);background:var(--bg-surface);border:1px solid var(--border)">
            <div style="font-size:15px;color:var(--text-secondary)">ไม่มีใบสมัครรอมอบหมาย</div>
          </div>
        </sc-if>

        <sc-if value="{{showTable}}" hint-placeholder-val="{{true}}">
          <div>
            <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Card" padding="{{0}}" hint-size="100%,auto">
              <div style="padding:16px">
                <sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
                  <div style="display:flex;flex-direction:column;gap:12px">
                    <div class="mlq-skel" style="height:20px;width:100%"></div>
                    <div class="mlq-skel" style="height:20px;width:100%"></div>
                    <div class="mlq-skel" style="height:20px;width:100%"></div>
                    <div class="mlq-skel" style="height:20px;width:100%"></div>
                  </div>
                </sc-if>
                <sc-if value="{{showFields}}" hint-placeholder-val="{{true}}">
                  <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Table" columns="{{columns}}" rows="{{rows}}" hint-size="100%,auto"></x-import>
                </sc-if>
              </div>
            </x-import>

            <sc-if value="{{isOverflow}}" hint-placeholder-val="{{false}}">
              <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px">
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" size="sm" on-click="{{onPrevPage}}" hint-size="auto,32px">Previous</x-import>
                <span style="font-size:13px;color:var(--text-secondary)">Page {{page}} of {{totalPages}}</span>
                <x-import component-from-global-scope="MiniLoanDesignSystem_4cbaa0.Button" variant="secondary" size="sm" on-click="{{onNextPage}}" hint-size="auto,32px">Next</x-import>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-if>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1100, &quot;height&quot;: 800},
  &quot;demoState&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;normal&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;normal&quot;, &quot;loading&quot;, &quot;error&quot;, &quot;empty&quot;, &quot;unauthorized&quot;, &quot;overflow&quot;], &quot;section&quot;: &quot;Demo state&quot;}
}">
class Component extends DCLogic {
  state = { page: 1, cancelledIds: [], assignedIds: [] };

  renderVals() {
    const demoState = this.props.demoState ?? 'normal';
    const isLoading = demoState === 'loading';
    const isError = demoState === 'error';
    const isEmpty = demoState === 'empty';
    const isUnauthorized = demoState === 'unauthorized';
    const isOverflow = demoState === 'overflow';
    const showPage = !isUnauthorized;
    const showTable = !isError && !isEmpty;
    const showFields = !isLoading;

    const bandColor = { A: 'var(--credit-band-a)', B: 'var(--credit-band-b)', C: 'var(--credit-band-c)' };

    const allApplicants = [
      { id: 'LA-20512', name: 'Chalermchai Intra', amount: '90,000', band: 'B' },
      { id: 'LA-20511', name: 'Panida Wongsuwan', amount: '150,000', band: 'A' },
      { id: 'LA-20510', name: 'Somsak Ruangrit', amount: '40,000', band: 'C' },
      { id: 'LA-20509', name: 'Aree Thanakit', amount: '200,000', band: 'B' },
      { id: 'LA-20508', name: 'Bunma Sirichai', amount: '65,000', band: 'A' },
      { id: 'LA-20507', name: 'Duangjai Petch', amount: '110,000', band: 'C' },
    ];

    const remaining = demoState === 'empty'
      ? []
      : allApplicants.filter((a) => !this.state.cancelledIds.includes(a.id) && !this.state.assignedIds.includes(a.id));

    const pageSize = 4;
    const page = isOverflow ? this.state.page : 1;
    const totalPages = isOverflow ? Math.max(1, Math.ceil(remaining.length / pageSize)) : 1;
    const pageItems = isOverflow ? remaining.slice((page - 1) * pageSize, page * pageSize) : remaining.slice(0, pageSize);

    const testCell = (testid, node) => React.createElement('div', { 'data-testid': testid }, node);

    const cancelApplication = (id) => this.setState((s) => ({ cancelledIds: [...s.cancelledIds, id] }));
    const assignToOfficer = (id) => this.setState((s) => ({ assignedIds: [...s.assignedIds, id] }));

    const cancelIcon = (a) => testCell('ui-miniloan-010-cancel-application', React.createElement(
      MiniLoanDesignSystem_4cbaa0.IconButton,
      { label: 'ยกเลิกใบสมัคร', onClick: () => cancelApplication(a.id) },
      React.createElement('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'var(--danger)', strokeWidth: 1.5 },
        React.createElement('circle', { cx: 12, cy: 12, r: 9 }),
        React.createElement('path', { d: 'M9 9l6 6M15 9l-6 6' }))
    ));
    const assignIcon = (a) => testCell('ui-miniloan-010-assign-officer', React.createElement(
      MiniLoanDesignSystem_4cbaa0.IconButton,
      { label: 'มอบหมายให้ Loan Officer', onClick: () => assignToOfficer(a.id) },
      React.createElement('svg', { width: 16, height: 16, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.5 },
        React.createElement('path', { d: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2' }),
        React.createElement('circle', { cx: 9, cy: 7, r: 4 }),
        React.createElement('path', { d: 'M19 8v6M22 11h-6' }))
    ));

    const columns = [
      { key: 'rowactions', label: '' },
      { key: 'name', label: 'ชื่อผู้สมัคร' },
      { key: 'status', label: 'สถานะ' },
      { key: 'band', label: 'Credit Band' },
      { key: 'amount', label: 'จำนวนเงินกู้ที่ขอ', align: 'right', numeric: true },
    ];
    const rows = pageItems.map((a) => ({
      rowactions: React.createElement('div', { style: { display: 'flex', gap: '4px' } }, cancelIcon(a), assignIcon(a)),
      name: testCell('ui-miniloan-010-ent-001-full-name', a.name),
      status: testCell('ui-miniloan-010-ent-002-status', React.createElement(MiniLoanDesignSystem_4cbaa0.StatusBadge, { state: 'Submitted' })),
      band: testCell('ui-miniloan-010-ent-003-band', React.createElement('span', { style: { color: bandColor[a.band], fontWeight: 700 } }, a.band)),
      amount: testCell('ui-miniloan-010-ent-002-requested-amount', a.amount + ' THB'),
    }));

    return {
      isLoading, isError, isEmpty, isUnauthorized, isOverflow, showPage, showTable, showFields,
      columns, rows,
      page, totalPages,
      onPrevPage: () => this.setState((s) => ({ page: Math.max(1, s.page - 1) })),
      onNextPage: () => this.setState((s) => ({ page: Math.min(totalPages, s.page + 1) })),
      onRetry: () => this.forceUpdate(),
    };
  }
}

</script>
</body>
</html>
