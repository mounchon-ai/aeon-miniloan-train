<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เอกสารความต้องการ — miniloan</title>
<style>
/* Petrol ground against warm paper. Deliberately NOT the cream-and-terracotta this page used to
   be: the status scale below is the palette, and a warm neutral cannot carry five signal steps
   without two of them reading the same. Every colour here names a state the document really has. */
:root{
  --ink:#1E2A32;--ink-2:#2A3944;--paper:#F7F5F0;--bg:#EDEEEC;--fg:#1B2227;--muted:#5F6B73;
  --line:#D5D6D2;--card:#fff;--accent:#3D7FA6;--warn:#B33A2B;
  --s-done:#2E7D5B;--s-partial:#C68A2E;--s-blocked:#B33A2B;--s-empty:#8794A0;--s-none:#5A6670;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#212C33;--bg:#161E23;--fg:#E7EAEC;--muted:#94A2AB;--line:#33414A;--card:#1C262C;
    --accent:#6FB2D6;--s-done:#4FA97C;--s-partial:#DCA84E;--s-blocked:#D9614E;--s-empty:#7D8B95;--s-none:#66737C}
}
*{box-sizing:border-box}
/* Flex column rather than a hard-coded calc() on the viewport height: the band's height depends on
   how many sections wrap and how long the directive is, so any number written here would be wrong
   on some spec. The previous version hard-coded 47px and survived only because its header was
   fixed. NOTE: no backticks anywhere inside this stylesheet — it lives in a JS template literal,
   and a stray one silently ends the string. That bug has already been paid for once. */
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,"Leelawadee UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--fg);
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── the band: title, the eight-segment spine, and the one directive ── */
header{background:var(--ink);color:#EBEFF1;padding:14px 20px 16px}
header .top{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
header .sum{color:#9FB0BA;font-size:12.5px}
header .warn{color:#E8A093;font-weight:600}

/* The spine IS the document's section order — a real sequence, so the numbers carry information. */
.spine{display:flex;gap:3px;margin:0 0 12px}
.spine .seg{flex:1;min-width:0;background:var(--ink-2);border:0;border-radius:3px;padding:0;cursor:pointer;
  color:inherit;font:inherit;text-align:left;position:relative;overflow:hidden}
.spine .seg .bar{height:9px;background:var(--s-empty)}
.spine .seg .no{display:block;padding:6px 8px 7px;font-size:11px;color:#AEBEC7;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.spine .seg[aria-current=true]{outline:2px solid #EBEFF1;outline-offset:1px}
.spine .seg:hover .no,.spine .seg:focus-visible .no{color:#fff}
/* Each segment is tinted with its own state, hand-mixed against the petrol rather than left to
   color-mix() so the page does not depend on how new the reader's browser is. State is ALSO
   carried by the icon in the label, because a spine that encodes status only in hue is unreadable
   to a colour-blind reviewer — and this band is the first thing anyone looks at. */
.spine .st-done{background:#1F3B33}   .st-done .bar{background:var(--s-done)}
.spine .st-partial{background:#3A3524} .st-partial .bar{background:var(--s-partial)}
.spine .st-blocked{background:#3B2622} .st-blocked .bar{background:var(--s-blocked)}
.spine .st-empty{background:#2A3944}   .st-empty .bar{background:var(--s-empty)}
.spine .st-none{background:#252F36}    .st-none .bar{background:var(--s-none)}

.directive{display:flex;gap:12px;align-items:flex-start;background:var(--ink-2);border-left:3px solid var(--s-partial);padding:10px 14px;border-radius:4px}
.directive.ok{border-left-color:var(--s-done)}
.directive .lead{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#93A5B0;margin-bottom:3px}
.directive code{font:13.5px/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace;background:#0F161B;color:#B8DCEF;padding:3px 8px;border-radius:4px;display:inline-block}
.directive .why{color:#9FB0BA;font-size:12.5px;margin-top:5px}

main{display:grid;grid-template-columns:250px 1fr 340px;flex:1;min-height:0}
@media (max-width:980px){
  body{height:auto;overflow:visible}
  main{grid-template-columns:1fr;flex:none}
  #canvas{height:60vh}
  aside{border-right:0;border-bottom:1px solid var(--line)}
}
aside{overflow:auto;padding:12px;border-right:1px solid var(--line);background:var(--paper)}

/* ── the status list: one row per section, the same eight the spine draws ── */
.sec{display:flex;gap:9px;padding:7px 6px;border-radius:5px;align-items:flex-start}
.sec:hover{background:var(--bg)}
.sec .pip{width:9px;height:9px;border-radius:2px;flex:none;margin-top:5px;background:var(--s-empty)}
.sec.st-done .pip{background:var(--s-done)}
.sec.st-partial .pip{background:var(--s-partial)}
.sec.st-blocked .pip{background:var(--s-blocked)}
.sec.st-empty .pip{background:var(--s-empty)}
.sec.st-none .pip{background:var(--s-none)}
.sec .t{font-size:12.5px;font-weight:600}
.sec .d{font-size:11.5px;color:var(--muted);margin-top:1px}
.sec .cmd{font:11.5px ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--accent);margin-top:3px;display:inline-block}
#panel{border-right:0;border-left:1px solid var(--line)}
#canvas{position:relative;overflow:hidden;background:var(--bg);cursor:grab}
#canvas.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.legend button{display:flex;gap:8px;align-items:center;width:100%;padding:4px 6px;margin-bottom:2px;border:0;border-radius:5px;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.legend button:hover{background:var(--line)}
.legend button[aria-pressed=false]{opacity:.38}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.legend .n{margin-left:auto;color:var(--muted);font-size:12px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#search{width:100%;padding:6px 8px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:inherit;font:inherit}
.node rect{stroke:var(--line);stroke-width:1.2}
.node text{font-size:11px;fill:var(--fg);pointer-events:none}
.node .sub{font-size:9.5px;fill:var(--muted)}
.node{cursor:pointer}
.node.dim{opacity:.14}
.node.sel rect{stroke:var(--accent);stroke-width:2.5}
path.edge{fill:none;stroke:var(--line);stroke-width:1.1}
path.edge.dim{opacity:.08}
path.edge.hot{stroke:var(--accent);stroke-width:2}
.colhead{font-size:11px;fill:var(--muted);font-weight:600}
#panel dl{margin:0}
#panel dt{font-size:11.5px;color:var(--muted);margin-top:9px}
#panel dd{margin:1px 0 0;word-break:break-word}
#panel .id{font:12.5px ui-monospace,Consolas,monospace;color:var(--accent)}
#panel h3{margin:6px 0 2px;font-size:15px}
#panel .rel{display:block;width:100%;text-align:left;border:0;background:none;color:var(--accent);font:inherit;padding:2px 0;cursor:pointer}
#panel .rel:hover{text-decoration:underline}
#panel .page{display:inline-block;margin-top:12px;color:var(--accent)}
.empty{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>

.md","detail":[["คำไทย","ตารางผ่อนฉบับที่ออกใหม่"],["คำอังกฤษ","RepaymentScheduleRevision"],["นิยาม","ตารางผ่อนฉบับใหม่ที่ออกทับฉบับเดิมของบัญชีสินเชื่อเดียวกัน เมื่อจำเป็นต้องเปลี่ยนตารางผ่อนที่ออกให้ผู้กู้ไปแล้ว — ออกทับทั้งฉบับ ไม่ใช่แก้บางแถวของฉบับเดิม · ฉบับเดิมยังเก็บไว้ดูย้อนหลังได้และห้ามลบ แนวเดียวกับเวอร์ชันของอัตราดอกเบี้ยใน BR-miniloan-037@v1"],["เรียกอีกอย่าง","ตารางผ่อนฉบับใหม่ · ออกตารางผ่อนใหม่ทับ"],["อย่าสับสนกับ","UL-miniloan-005"],["สถานะ","draft"]]},{"id":"UL-miniloan-018","kind":"UL","title":"การโปะเงินต้น","page":"../../docs/wiki/glossary/UL-miniloan-018.md","detail":[["คำไทย","การโปะเงินต้น"],["คำอังกฤษ","PartialPrepayment"],["นิยาม","การชำระเกินยอดงวด โดยส่วนที่เกินถูกนำไปตัดเงินต้นของบัญชีสินเชื่อที่ยังเป็น Active — บัญชีไม่ปิด ยังผ่อนต่อ แต่เงินต้นลดลงจึงต้องออกตารางผ่อนฉบับใหม่ทับตาม BR-miniloan-044@v1 · ส่วนเกินไปลดจำนวนงวดโดยค่างวดคงเดิม (Q-miniloan-010) · มีค่าธรรมเนียม 1% ของยอดส่วนที่เกิน หักออกจากส่วนเกินก่อนนำไปตัดเงินต้น (Q-miniloan-013 → BR-miniloan-050@v1) · ถ้าส่วนเกินมากพอปิดบัญชีได้ในครั้งเดียว ไม่ใช่การโปะแล้ว แต่เป็นการปิดบัญชีก่อนกำหนดตาม BR-miniloan-051@v1"],["เรียกอีกอย่าง","ชำระเกินยอดงวด · โปะ"],["อย่าสับสนกับ","UL-miniloan-008"],["สถานะ","draft"]]},{"id":"UL-miniloan-019","kind":"UL","title":"หัวหน้าเจ้าหน้าที่สินเชื่อ","page":"../../docs/wiki/glossary/UL-miniloan-019.md","detail":[["คำไทย","หัวหน้าเจ้าหน้าที่สินเชื่อ"],["คำอังกฤษ","Supervisor"],["นิยาม","ผู้ที่มีอำนาจสั่งมอบหมายใบสมัครให้ Loan Officer รายคน — เอกสารต้นทาง §3 ไม่มี actor นี้ (มีแค่ Applicant / Loan Officer / Operations / System) เกิดขึ้นจากคำตอบของ Q-miniloan-005 · ยังไม่ตัดสินว่ามีกี่ระดับ ทำอย่างอื่นได้อีกไหม และเห็นข้อมูลของลูกน้องแค่ไหน — ส่วนขอบเขตข้อมูลค้างอยู่ที่ DQ-miniloan-002"],["เรียกอีกอย่าง","หัวหน้า · หัวหน้าทีมสินเชื่อ"],["อย่าสับสนกับ","UL-miniloan-013"],["สถานะ","draft"]]},{"id":"UL-miniloan-020","kind":"UL","title":"การยกเลิกใบสมัคร","page":"../../docs/wiki/glossary/UL-miniloan-020.md","detail":[["คำไทย","การยกเลิกใบสมัคร"],["คำอังกฤษ","ApplicationCancellation"],["นิยาม","การจบใบสมัครก่อนถึงการเบิกจ่าย โดยใบนั้นไปอยู่สถานะสุดท้าย Cancelled — ทำได้ตั้งแต่ Draft ถึง Approved เท่านั้น ใบที่ Disbursed แล้วยกเลิกไม่ได้ · **สั่งได้เฉพาะเจ้าหน้าที่ (Loan Officer) และต้องระบุเหตุผลเสมอ** — Applicant ยกเลิกใบของตัวเองไม่ได้ ต้องแจ้งเจ้าหน้าที่ · เป็นวิธีแก้เดียวเมื่อใบสมัครเดินสถานะผิด เพราะ BR-miniloan-010@v1 ไม่มีเส้นถอยกลับ · ใครยกเลิกใบที่ยังไม่ถูกมอบหมายได้ ยังไม่ตัดสิน — ดู Q-miniloan-012"],["เรียกอีกอย่าง","ยกเลิกใบสมัคร · Cancel"],["อย่าสับสนกับ","UL-miniloan-008"],["สถานะ","draft"]]},{"id":"UL-miniloan-021","kind":"UL","title":"ค่าธรรมเนียมการโปะ","page":"../../docs/wiki/glossary/UL-miniloan-021.md","detail":[["คำไทย","ค่าธรรมเนียมการโปะ"],["คำอังกฤษ","PrepaymentFee"],["นิยาม","ค่าธรรมเนียม 1% ของยอดส่วนที่เกิน ซึ่งเกิดขึ้นเมื่อผู้กู้โปะเงินต้นของบัญชีที่ยังเป็น Active — หักออกจากยอดส่วนเกินก่อนนำไปตัดเงินต้น ไม่ใช่รายการเรียกเก็บแยก (BR-miniloan-050@v1) · ต่างจากค่าธรรมเนียมปิดก่อนกำหนดซึ่งคิด 1% ของเงินต้นคงเหลือและใช้เมื่อบัญชีปิด (BR-miniloan-022@v1) · ที่ขอบซึ่งส่วนเกินพอปิดบัญชีได้พอดี ให้ใช้ฐานปิดก่อนกำหนดเสมอตาม BR-miniloan-051@v1"],["เรียกอีกอย่าง","ค่าธรรมเนียมโปะ · ค่าธรรมเนียมชำระเกิน"],["อย่าสับสนกับ","UL-miniloan-008"],["สถานะ","draft"]]},{"id":"UL-miniloan-022","kind":"UL","title":"เงินต้นคงเหลือ","page":"../../docs/wiki/glossary/UL-miniloan-022.md","detail":[["คำไทย","เงินต้นคงเหลือ"],["คำอังกฤษ","OutstandingPrincipal"],["นิยาม","เงินต้นที่ยังไม่ได้ชำระของบัญชีสินเชื่อ ณ เวลาหนึ่ง — เป็นฐานของดอกเบี้ยรายงวด (ดอกเบี้ยงวด = เงินต้นคงเหลือ × อัตราต่อเดือน ตาม BR-miniloan-016@v1) · เป็นฐานของยอดปิดบัญชีก่อนกำหนดและค่าธรรมเนียม 1% ตาม BR-miniloan-022@v1 · เป็นคอลัมน์สุดท้ายของตารางผ่อน ซึ่งต้องเป็น 0 พอดีหลังงวดสุดท้าย · **\"ยอดคงเหลือ\" ที่พบในเอกสารต้นทางและในกฎหลายข้อคือคำเดียวกันกับคำนี้** ไม่ใช่ยอดที่ต้องจ่ายทั้งหมดที่เหลือ (ซึ่งจะรวมดอกเบี้ยในอนาคต) — ยืนยันแล้วในรอบ QB-lang-01 · คำหลักเลือก \"เงินต้นคงเหลือ\" เพราะเป็นคำที่ไม่กำกวม · **แหล่งอ้างอิงเดียวของค่านี้คือคอลัมน์ยอดคงเหลือของตารางผ่อนฉบับล่าสุด** ไม่ใช่การคำนวณขึ้นใหม่จากสูตร — ตัดสินในรอบตอบการ์ดแดง Q-miniloan-016 และเขียนเป็น BR-miniloan-053@v1"],["เรียกอีกอย่าง","ยอดคงเหลือ · ยอดเงินต้นคงเหลือ · เงินต้นที่เหลือ"],["อย่าสับสนกับ","UL-miniloan-008"],["สถานะ","draft"]]},{"id":"UL-miniloan-023","kind":"UL","title":"ยอดที่อนุมัติจริง","page":"../../docs/wiki/glossary/UL-miniloan-023.md","detail":[["คำไทย","ยอดที่อนุมัติจริง"],["คำอังกฤษ","ApprovedAmount"],["นิยาม","จำนวนเงินที่ Loan Officer อนุมัติจริงให้ใบสมัครหนึ่งใบ — อาจต่ำกว่าจำนวนเงินกู้ที่ขอ (UL-miniloan-011) เมื่อยอดที่ขอเกินวงเงินอนุมัติสูงสุด (UL-miniloan-010) และเจ้าหน้าที่ปรับลงตาม BR-miniloan-012@v1 · เป็นตัวเลขที่กลายเป็นเงินต้นตั้งต้น (P) ของตารางผ่อนตอนเบิกจ่าย · **ไม่ใช่ตัวเดียวกับจำนวนเงินกู้ที่ขอ** — DTI ที่บันทึกไว้ตอนยื่นผูกกับยอดที่ขอและไม่คำนวณใหม่แม้เจ้าหน้าที่จะปรับวงเงินลง (Q-miniloan-002) ถ้าใช้คำเดียวกัน ตัวเลขที่ DTI อ้างถึงจะหายไป · **กฎที่ระบุว่า P ของ BR-miniloan-016@v1 มาจากยอดนี้ยังไม่ถูกเขียนเป็น BR** เพราะรอบที่คลอดคำนี้เป็นรอบชั้น 1 ซึ่งเขียน rules[] ไม่ได้ — เส้นทางที่เหลือคือ /req:calc BR-miniloan-016@v1 ซึ่งต้องระบุ input ของสูตรอยู่แล้ว"],["เรียกอีกอย่าง","ยอดอนุมัติ · วงเงินที่อนุมัติจริง"],["อย่าสับสนกับ","UL-miniloan-011 · UL-miniloan-010 · UL-miniloan-022"],["สถานะ","draft"]]},{"id":"UL-miniloan-024","kind":"UL","title":"ผู้สมัคร","page":"../../docs/wiki/glossary/UL-miniloan-024.md","detail":[["คำไทย","ผู้สมัคร"],["คำอังกฤษ","Applicant"],["นิยาม","คนที่ยื่นขอสินเชื่อ และเป็นคนเดียวกับคนที่ถือบัญชีสินเชื่อหลังเบิกจ่าย — **หนึ่งคน หนึ่งคำ** ไม่แยกเป็นคนละแนวคิดตามช่วงเวลา · คำว่า \"ผู้กู้\" และ \"ลูกค้า\" ที่ปรากฏใน spec เป็นคำเรียกอย่างอื่นของคนคนเดียวกัน ไม่ใช่ actor คนละตัว — ทั้งสองคำไม่มีในเอกสารต้นทางเลย เกิดขึ้นระหว่างการเก็บกฎ · เลือก \"ผู้สมัคร / Applicant\" เป็นคำหลักจากอินพุต (§3 ตาราง actor) — **เป็นการอ่าน ไม่ใช่คำตอบ เจ้าของยังไม่ได้ระบุคำหลัก**"],["เรียกอีกอย่าง","ผู้กู้ · ลูกค้า"],["อย่าสับสนกับ","UL-miniloan-002"],["สถานะ","draft"]]},{"id":"UL-miniloan-025","kind":"UL","t an-001@v2 จริงแล้วยืนยันว่าไม่มีค่าที่ต่างกันระหว่างทางอีก ตัวเลขที่ยังไม่ได้รันไม่ใช่หลักฐาน · GD-miniloan-001 (เลขเฉลยเดิม) คำนวณภายใต้กลไกของ @v1 จึงใช้ไม่ได้แล้ว อยู่ใน invalidates[] ของ CHG-miniloan-005 ต้องรันเลขเฉลยใหม่ · EX-miniloan-147 (พิสูจน์ BR-miniloan-053@v1) อาศัยผลต่าง 50,000.02 vs 50,000.00 ของกลไก @v1 เป็นหลักฐาน boundary — ผลต่างนั้นหายไปใต้ @v2 ต้องรีวิว/แก้ผ่าน /req:example BR-miniloan-053@v1 แยกต่างหาก ตามที่บันทึกเตือนไว้ล่วงหน้าแล้วในเอกสารว่า \"ต้องรีวิวใบนี้ใหม่เมื่อนั้น\""]]},{"id":"CALC-miniloan-002@v1","kind":"CALC","title":"ยอดปิดบัญชีก่อนกำหนด = เงินต้นคงเหลือ + ดอกเบี้ยค้างจ่าย + ค่าธรรมเนียมปิดก่อนกำหนด · ดอกเบี้ยค้างจ่าย = เงินต้นคงเหลือ × อัตราดอกเบี้ยต่อปี × (จำนวนวันจริงจากวันครบกำหนดงวดล่าสุดที่ชำระแล้ว ถึงวันที่ปิด) / 365 · ค่าธรรมเนียมปิดก่อนกำหนด = เงินต้นคงเหลือ × 1%","page":"../../docs/wiki/calculations/CALC-miniloan-002@v1.md","detail":[["พินกฎ","BR-miniloan-022@v1"],["เวอร์ชัน","v1"],["ใช้อยู่","ใช่"],["สถานะ","draft"],["สูตร","ยอดปิดบัญชีก่อนกำหนด = เงินต้นคงเหลือ + ดอกเบี้ยค้างจ่าย + ค่าธรรมเนียมปิดก่อนกำหนด · ดอกเบี้ยค้างจ่าย = เงินต้นคงเหลือ × อัตราดอกเบี้ยต่อปี × (จำนวนวันจริงจากวันครบกำหนดงวดล่าสุดที่ชำระแล้ว ถึงวันที่ปิด) / 365 · ค่าธรรมเนียมปิดก่อนกำหนด = เงินต้นคงเหลือ × 1%"],["ตัวแปรเข้า","remaining_principal: money(2) · last_due_date_paid: date · closing_date: date · annual_rate: rate(10)"],["ชนิดตัวเลข","decimal"],["วิธีปัด","HALF_UP ที่ ปัดทันทีที่แต่ละองค์ประกอบคำนวณเสร็จตาม BR-miniloan-035@v1 — ไม่เก็บค่าเต็มไว้แล้วปัดตอนแสดงผล: ดอกเบี้ยค้างจ่ายปัด (round half up) ที่ 2 ตำแหน่งทันทีที่คำนวณเสร็จ · ค่าธรรมเนียมปิดก่อนกำหนด (1% ของเงินต้นคงเหลือ) ปัดที่ 2 ตำแหน่งทันทีที่คำนวณเสร็จ · ยอดปิดบัญชี = ผลรวมขององค์ประกอบที่ปัดแล้วทั้งสาม (เงินต้นคงเหลือซึ่งปัดอยู่แล้วในตัวตาม BR-miniloan-053@v1 + ดอกเบี้ยค้างจ่ายที่ปัดแล้ว + ค่าธรรมเนียมที่ปัดแล้ว) — ไม่ปัดยอดรวมซ้ำอีกครั้ง เพราะผลรวมของจำนวนเต็มสตางค์สามจำนวนก็เป็นจำนวนเต็มสตางค์อยู่แล้ว ตำแหน่ง"],["พฤติกรรมที่ขอบ","เงินต้นคงเหลือ = 0 (บัญชีผ่อนหมดพอดีหรือปิดไปแล้ว) → สูตรรองรับเองโดยไม่ต้องกันพิเศษที่ชั้นสัญญานี้: ดอกเบี้ยค้างจ่าย = 0 × อัตรา × วัน/365 = 0 · ค่าธรรมเนียม = 0 × 1% = 0 · ยอดปิดบัญชี = 0 บาท · จำนวนวันจริงจากวันครบกำหนดงวดล่าสุดที่ชำระแล้วถึงวันที่ปิด = 0 (ปิดตรงวันครบกำหนดที่เพิ่งชำระพอดี) → ดอกเบี้ยค้างจ่าย = 0 บาท ตามที่ระบุไว้ตรงๆ ในถ้อยคำของ BR-miniloan-022@v1 เอง · จำนวนวันติดลบ (closing_date ก่อนวันครบกำหนดงวดล่าสุดที่ชำระแล้ว) → เกิดขึ้นไม่ได้ในเส้นทางจริง เพราะหน้าจอบังคับ closing_date ≥ วันนี้เสมอ และวันนี้ ≥ วันครบกำหนดงวดล่าสุดที่ชำระแล้วโดยธรรมชาติของเวลา — สัญญาไม่นิยามพฤติกรรมสำหรับกรณีนี้เพราะไม่ใช่เส้นทางที่ระบบต้องรองรับ · อัตราดอกเบี้ยต่อปี = 0% → ดอกเบี้ยค้างจ่าย = 0 บาทเสมอไม่ว่าจำนวนวันเท่าไร — สูตรนี้เป็นการคูณตรง ไม่มีตัวหารที่เป็นฟังก์ชันของอัตรา จึงไม่มีขอบหารด้วยศูนย์แบบที่ CALC-miniloan-001 เจอกับ EMI"],["หมายเหตุ","สัญญานี้เป็นยอดปิดบัญชีก้อนเดียว ไม่ใช่ตารางแบ่งงวดแบบ CALC-miniloan-001 — จึงไม่มี residual_policy และไม่มีขอบ n=1/นอกช่วงงวดแบบเดียวกัน · remaining_principal อ่านจากคอลัมน์เดียวกับที่ CALC-miniloan-001@v2 เขียน (ผ่าน BR-miniloan-053@v1) จึงไม่มีความเสี่ยงคอลัมน์คู่ขนานแบบที่เคยเกิดกับ Q-miniloan-016 · DQ-miniloan-001 (decimal(p,s)) ผูกร่วมกับ CALC-miniloan-001 เพราะเป็นคำถามระดับ Money ทั้งระบบ ไม่ใช่คำถามใหม่เฉพาะสัญญานี้ · ยังไม่มีการรัน /req:golden — เลขบาทจริงต้องรอคำสั่งนั้นแยกต่างหาก"]]},{"id":"CALC-miniloan-003@v1","kind":"CALC","title":"ค่าธรรมเนียมการโปะ = ROUND(ส่วนเกิน × 1%, HALF_UP) ปัดทันทีที่คำนวณเสร็จตาม BR-miniloan-035@v1 · เงินต้นที่ลดลง (principal_cut) = ส่วนเกิน − ค่าธรรมเนียมที่ปัดแล้ว — ถ้อยคำ \"(เท่ากับส่วนเกิน × 99%)\" ใน BR-miniloan-050@v2 เป็นคำอธิบายโดยประมาณเท่านั้น ไม่ใช่เส้นทางคำนวณคู่ขนาน: ลำดับที่ผูกพันคือปัดค่าธรรมเนียม 1% ก่อน แล้วจึงลบออกจากส่วนเกิน ไม่ใช่ปัดผลคูณ 99% โดยตรง — ทั้งสองทางให้ผลต่างกันเมื่อค่าธรรมเนียมตกที่กึ่งสตางค์พอดี (เช่น ส่วนเกิน 1.50: ทาง a → ค่าธรรมเนียม 0.015→HALF_UP→0.02 เงินต้นลด 1.48 · ทาง b → 1.50×99%=1.485→HALF_UP→1.49) — ยืนยันแล้วผ่าน AskUserQuestion ระหว่างรอบเก็บสัญญานี้ (ดู SRC-019 [1])","page":"../../docs/wiki/calculations/CALC-miniloan-003@v1.md","detail":[["พินกฎ","BR-miniloan-050@v2"],["เวอร์ชัน","v1"],["ใช้อยู่","ใช่"],["สถานะ","draft"],["สูตร","ค่าธรรมเนียมการโปะ = ROUND(ส่วนเกิน × 1%, HALF_UP) ปัดทันทีที่คำนวณเสร็จตาม BR-miniloan-035@v1 · เงินต้นที่ลดลง (principal_cut) = ส่วนเกิน − ค่าธรรมเนียมที่ปัดแล้ว — ถ้อยคำ \"(เท่ากับส่วนเกิน × 99%)\" ใน BR-miniloan-050@v2 เป็นคำอธิบายโดยประมาณเท่านั้น ไม่ใช่เส้นทางคำนวณคู่ขนาน: ลำดับที่ผูกพันคือปัดค่าธรรมเนียม 1% ก่อน แล้วจึงลบออกจากส่วนเกิน ไม่ใช่ปัดผลคูณ 99% โดยตรง — ทั้งสองทางให้ผลต่างกันเมื่อค่าธรรมเนียมตกที่กึ่งสตางค์พอดี (เช่น ส่วนเกิน 1.50: ทาง a → ค่าธรรมเนียม 0.015→HALF_UP→0.02 เงินต้นลด 1.48 · ทาง b → 1.50×99%=1.485→HALF_UP→1.49) — ยืนยันแล้วผ่าน AskUserQuestion ระหว่างรอบเก็บสัญญานี้ (ดู SRC-019 [1])"],["ตัวแปรเข้า","surplus_amount: money(2) · remaining_principal: money(2)"],["ชนิดตัวเลข","decimal"],["วิธีปัด","HALF_UP ที่ ปัดทันทีที่แต่ละองค์ประกอบคำนวณเสร็จตาม BR-miniloan-035@v1 — ไม่เก็บค่าเต็มไว้แล้วปัดตอนแสดงผล: ค่าธรรมเนียมการโปะ (1% ของส่วนเกิน) ปัดที่ 2 ตำแหน่งทันทีที่คำนวณเสร็จ ก่อนนำไปลบออกจากส่วนเกิน · เงินต้นที่ลดลง (principal_cut) = ส่วนเกิน − ค่าธรรมเนียมที่ปัดแล้ว ไม่ปัดผลต่างซ้ำอีกครั้ง (ผลต่างของจำนวนเต็มสตางค์สองจำนวนก็เป็นจำนวนเต็มสตางค์อยู่แล้ว) · ลำดับนี้คือคำตอบของคำถามลำดับการคำนวณที่ยกขึ้นระหว่างรอบเก็บสัญญา (ดู SRC-019 [1]) — ปัดค่าธรรมเนียมก่อน ไม่ใช่ปัดผลคูณ 99% โดยตรง ตำแหน่ง"],["พฤติกรรมที่ขอบ","ส่วนเกิน = 0 (ชำระพอดีตามยอดงวด ไม่มีการโปะ) → ค่าธรรมเนียม = ROUND(0 × 1%) = 0 · เงินต้นที่ลดลง = 0 − 0 = 0 — สูตรรองรับเองโดยไม่ต้องกันพิเศษที่ชั้นสัญญานี้ ไม่ถือเป็นเหตุการณ์โปะ เป็นเพียงงวดปกติที่ชำระตรงยอด · principal_cut (ส่วนเกินหลังหักค่าธรรมเนียมแล้ว) มากกว่าเงินต้นคงเหลือ → ระบบต้องปฏิเสธการบันทึกทั้งรายการตาม BR-miniloan-052@v2 (ทริกเกอร์ที่สอง: \"ส่วนเกินหลังหักค่าธรรมเนียมการโปะ 1% ตาม BR-miniloan-050@v2 แล้วมากกว่าเงินต้นคงเหลือ\") — ฐานเปรียบเทียบคือเงินต้นคงเหลือตาม BR-miniloan-053@v1 ไม่ใช่ยอดปิดบัญชีก่อนกำหนดเต็มจำนวนตาม BR-miniloan-022@v1 (เงินต้น + ดอกเบี้ยค้างจ่าย + ค่าธรรมเนียมปิดบัญชี) · หมายเหตุ: ถ้อยคำใน BR-miniloan-050@v2 เองยังอ้างว่าเงื่อนไขนี้ \"ยังไม่ถูกขยายให้ครอบกรณีนี้โดยตรง — ดู CHG-miniloan-003\" แต่ ณ วันที่ทำสัญญานี้ CHG-miniloan-004 ได้ขึ้นเวอร์ชัน BR-miniloan-052 เป็น @v2 ไปแล้วซึ่งครอบกรณีนี้ตรงๆ สัญญานี้จึงอ้างสถานะปัจจุบัน (@v2) ไม่ใช่ถ้อยคำที่ค้างอยู่ใน BR-miniloan-050@v2 · principal_cut เท่ากับเงินต้นคงเหลือพอดี (เท่ากัน ไม่ใช่มากกว่า) → อนุญาต ไม่ปฏิเสธ — เงินต้นลดลงเหลือ 0 พอดีในเส้นทางการโปะ ไม่ใช่การปิดบัญชีก่อนกำหนดตาม BR-miniloan-022@v1 (คนละเส้นทาง คนละสัญญา คนละงวด/ดอกเบี้ยค้างจ่าย)"],["หมายเหตุ","สัญญานี้ครอบเฉพาะขั้นหักค่าธรรมเนียม/ลดเงินต้นของการโปะ ไม่ครอบการออกตารางผ่อนฉบับใหม่ (นั่นคือ BR-miniloan-044@v1 ผ่านกลไกของ CALC-miniloan-001) · remaining_principal อ่านจากคอลัมน์เดียวกับที่ CALC-miniloan-001@v2 และ CALC-miniloan-002@v1 อ่าน (ผ่าน BR-miniloan-053@v1) จึงไม่มีความเสี่ยงคอลัมน์คู่ขนาน · เกณฑ์ปฏิเสธอ้าง BR-miniloan-052@v2 (สถานะปัจจุบัน ณ วันที่ทำสัญญา) ไม่ใช่ @v1 ที่ statement ของ BR-miniloan-050@v2 ยังค้างอ้างอยู่ — ดูรายละเอียดใน boundary_behavior[1] · DQ-miniloan-001 (decimal(p,s)) ผูกร่วมกับ CALC-miniloan-001/002 เพราะเป็นคำถามระดับ Money ทั้งระบบ ไม่ใช่คำถามใหม่เฉพาะสัญญานี้ · ยังไม่มีการรัน /req:golden — เลขบาทจริงต้องรอคำสั่งนั้นแยกต่างหาก"]]},{"id":"CALC-miniloan-004@v1","kind":"CALC","title":"DTI (สำหรับแสดงผล) = (ภาระหนี้เดิมต่อเดือน + งวดใหม่) / รายได้ต่อเดือน · เกณฑ์ผ่าน/ตก (ตัดสินผลจริง) แยกจากค่าที่แสดง: ผ่าน ⟺ (ภาระหนี้เดิมต่อเดือน + งวดใหม่) ≤ 0.70 × รายได้ต่อเดือน เทียบกันเป็นบาทที่ความละเอียดเต็ม ไม่ใช่เทียบที่ตัว % ที่ปัดแล้ว","page":"../../docs/wiki/calculations/CALC-miniloan-004@v1.md","detail":[["พินกฎ","BR-miniloan-002@v1"],["เวอร์ชัน","v1"],["ใช้อยู่","ใช่"],["สถานะ","draft"],["สูตร","DTI (สำหรับแสดงผล) = (ภาระหนี้เดิมต่อเดือน + งวดใหม่) / รายได้ต่อเดือน · เกณฑ์ผ่าน/ตก (ตัดสินผลจริง) แยกจากค่าที่แสดง: ผ่าน ⟺ (ภาระหนี้เดิมต่อเดือน + งวดใหม่) ≤ 0.70 × รายได้ต่อเดือน เทียบกันเป็นบาทที่ความละเอียดเต็ม ไม่ใช่เทียบที่ตัว % ที่ปัดแล้ว"],["ตัวแปรเข้า","existing_monthly_debt: money(2) · monthly_income: money(2) · new_installment: money(2)"],["ชนิดตัวเลข","decimal"],["วิธีปัด","HALF_UP ที่ new_installment รับมาเป็น money(2) ที่ปัดมาแล้วจาก CALC-miniloan-001@v2 (ไม่ปัดซ้ำ) · ผลรวม (existing_monthly_debt + new_installment) กับเกณฑ์ 0.70 × monthly_income เทียบกันที่ความละเอียดเต็ม ไม่ปัดก่อนเทียบ — ตาม EX-miniloan-038 ที่ยืนยันว่าการตัดสินผ่าน/ตกใช้ยอดบาทที่เกินจริง ไม่ใช่เปอร์เซ็นต์ที่ปัดแล้ว · DTI% ที่แสดงบนหน้าจอผลการประเมิน = round((existing_monthly_debt + new_installment) / monthly_income × 100, 2) ด้วย HALF_UP — เป็นค่าที่ใช้ 'แสดง' เท่านั้น ไม่ป้อนกลับเข้าไปตัดสินผ่าน/ตก ตำแหน่ง"],["พฤติกรรมที่ขอบ","monthly_income \u003c 15,000 บาท (รวมถึง = 0) → ถูกปฏิเสธตั้งแต่ BR-miniloan-001@v1 ก่อนถึงสัญญานี้ สัญญานี้ไม่คำนวณและไม่ต้องกันหารด้วยศูนย์เอง — เหมือนที่ CALC-miniloan-001@v2 ปล่อยให้ BR-miniloan-004@v1 กรองช่วงนอกเขตของ P/n ก่อนถึงสูตร · (existing_monthly_debt + new_installment) = 0.70 × monthly_income พอดี (DTI ชนเพดานพอดี) → ผ่าน ไม่ใช่ตก ตาม EX-miniloan-037 · เจ้าหน้าที่ปรับวงเงินลงภายหลังตาม BR-miniloan-012@v1 → DTI ที่บันทึกไว้ไม่ถูกคำนวณใหม่ ยังคงอิงจำนวนเงินกู้ที่ขอตอนยื่น (และ new_installment ที่คำนวณจากยอดนั้น) ตาม EX-miniloan-040 — สัญญานี้ถูกเรียกครั้งเดียวตอนยื่น ไม่มี trigger ให้เรียกซ้ำเมื่อวงเงินเปลี่ยน"],["หมายเหตุ","สัญญานี้ครอบเฉพาะการตัดสินผ่าน/ตกและค่า DTI% ที่แสดงผลของ BR-miniloan-002@v1 — ไม่ครอบการคำนวณ EMI (นั่นคือ CALC-miniloan-001@v2 ผ่าน BR-miniloan-016@v1) · จุดสำคัญที่สัญญานี้ปิดคือช่องว่างระหว่างค่า % ที่ปัดแสดงกับค่าที่ใช้ตัดสินจริง ซึ่ง EX-miniloan-037/038 พิสูจน์ไว้แล้วแต่ยังไม่เคยถูกเขียนเป็นสูตรที่ชัด · DQ-miniloan-001 (decimal(p,s)) ผูกร่วมกับ CALC-miniloan-001/002/003 เพราะเป็นคำถามระดับ Money ทั้งระบบ ไม่ใช่คำถามใหม่เฉพาะสัญญานี้ · ยังไม่มีการรัน /req:golden — เลขบาทจริงต้องรอคำสั่งนั้นแยกต่างหาก"]]},{"id":"CALC-miniloan-005@v1","kind":"CALC","title":"MaxApprovableAmount = MIN(5 × monthly_income, 1,000,000) — ค่าคงที่ 5 (ตัวคูณ) และ 1,000,000 (เพดานบาท) ฝังอยู่ในสูตรของสัญญาเอง ไม่ใช่ข้อมูลหลักที่มีเวอร์ชันแยกต่างหากแบบอัตราดอกเบี้ย (BR-miniloan-036@v1/037@v1) — เปลี่ยนค่าใดค่าหนึ่งต้องขึ้นเวอร์ชันกฎ BR-miniloan-003 ผ่าน /req:change เท่านั้น","page":"../../docs/wiki/calculations/CALC-miniloan-005@v1.md","detail":[["พินกฎ","BR-miniloan-003@v1"],["เวอร์ชัน","v1"],["ใช้อยู่","ใช่"],["สถานะ","draft"],["สูตร","MaxApprovableAmount = MIN(5 × monthly_income, 1,000,000) — ค่าคงที่ 5 (ตัวคูณ) และ 1,000,000 (เพดานบาท) ฝังอยู่ในสูตรของสัญญาเอง ไม่ใช่ข้อมูลหลักที่มีเวอร์ชันแยกต่างหากแบบอัตราดอกเบี้ย (BR-miniloan-036@v1/037@v1) — เปลี่ยนค่าใดค่าหนึ่งต้องขึ้นเวอร์ชันกฎ BR-miniloan-003 ผ่าน /req:change เท่านั้น"],["ตัวแปรเข้า","monthly_income: money(2)"],["ชนิดตัวเลข","decimal"],["วิธีปัด","HALF_UP ที่ ไม่มีจุดปัดที่เกิดขึ้นจริงในสูตรนี้ — 5 เป็นจำนวนเต็ม, 1,000,000 เป็นจำนวนเต็มบาท, 5×money(2) ที่เป็นจำนวนเต็มสตางค์อยู่แล้วยังเป็นจำนวนเต็มสตางค์ (ไม่มีเศษใหม่เกิดขึ้น) และ MIN() ไม่แนะนำทศนิยมใหม่ — ผลลัพธ์จึงคงความละเอียด 2 ตำแหน่งเท่าที่ monthly_income มีอยู่แล้วเสมอ · rounding_mode = HALF_UP ระบุไว้ตาม BR-miniloan-035@v1 ที่ใช้ทั้งระบบ แต่เป็น field ที่ไม่เคยถูกเรียกใช้จริงในสัญญานี้ (inert) ตำแหน่ง"],["พฤติกรรมที่ขอบ","monthly_income × 5 \u003c 1,000,000 → ใช้สูตร 5× ตรงๆ ตาม EX-miniloan-019 (happy) และ EX-miniloan-020 (boundary — 199,999 บาท/เดือน ค่าสุดท้ายก่อนเพดานมีผล) · monthly_income × 5 = 1,000,000 พอดี (รายได้ 200,000 บาท/เดือน) → สองสูตร (5× กับเพดาน) ให้คำตอบเดียวกันพอดี ไม่มีนัยว่าใช้ทางไหนตัดสิน ตาม EX-miniloan-021 · monthly_income × 5 > 1,000,000 → ผลลัพธ์ถูกจำกัดที่เพดาน 1,000,000 บาท ไม่ใช่ 5×รายได้ ตาม EX-miniloan-022"],["หมายเหตุ","สัญญานี้ไม่มีจุดปัดที่เกิดขึ้นจริง — เป็นสัญญาที่ง่ายที่สุดในโมดูลนี้เพราะไม่มีการคูณ/หารที่สร้างทศนิยมใหม่เลย ต่างจาก CALC-miniloan-001/002/003/004 ที่ล้วนมีจุดปัดจริง · DQ-miniloan-001 (decimal(p,s)) ผูกร่วมกับ CALC-miniloan-001/002/003/004 เพราะเป็นคำถามระดับ Money ทั้งระบบ ไม่ใช่คำถามใหม่เฉพาะสัญญานี้ · ยังไม่มีการรัน /req:golden — เลขบาทจริงต้องรอคำสั่งนั้นแยกต่างหาก"]]},{"id":"GD-miniloan-001","kind":"GD","title":" <script>
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var COLORS = {REQ:"#4a7ab8",BR:"#b8823a",EX:"#4f9068",CALC:"#8a6bb5",GD:"#3f8f96",Q:"#c0392b",DQ:"#c78b1e",UL:"#7a8b96",STK:"#96707a",SRC:"#8a8577",NFR:"#5f8a5f",CHG:"#a8574a"};
var COLW = 210, ROWH = 44, BOXW = 178, BOXH = 32, TOP = 34;

var byId = {}, i;
for (i = 0; i < D.nodes.length; i++) byId[D.nodes[i].id] = D.nodes[i];

// columns follow the declared order; a kind nobody ordered goes to the end rather than nowhere
var kinds = [], seen = {};
for (i = 0; i < D.columnOrder.length; i++) seen[D.columnOrder[i]] = true;
for (i = 0; i < D.nodes.length; i++) if (!seen[D.nodes[i].kind]) { seen[D.nodes[i].kind] = true; D.columnOrder.push(D.nodes[i].kind); }
for (i = 0; i < D.columnOrder.length; i++) {
  var k = D.columnOrder[i];
  var members = D.nodes.filter(function (n) { return n.kind === k; });
  if (members.length) kinds.push({ kind: k, nodes: members });
}
kinds.forEach(function (col, ci) {
  col.x = ci * COLW + 20;
  col.nodes.forEach(function (n, ri) { n.x = col.x; n.y = ri * ROWH + TOP; });
});

var svg = document.getElementById("svg"), view = document.getElementById("view");
var gEdges = document.getElementById("edges"), gNodes = document.getElementById("nodes");
var NS = "http://www.w3.org/2000/svg";
function el(name, attrs) { var e = document.createElementNS(NS, name); for (var a in attrs) e.setAttribute(a, attrs[a]); return e; }
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
// a title identical to the id says nothing the line above it did not already say
function sub(n) { return n.title === n.id ? "" : n.title; }

kinds.forEach(function (col) {
  var t = el("text", { x: col.x, y: 18, class: "colhead" });
  t.textContent = (D.kindLabel[col.kind] || col.kind) + " · " + col.nodes.length;
  gNodes.appendChild(t);
});

var edgeEls = [];
D.edges.forEach(function (e) {
  var a = byId[e.from], b = byId[e.to];
  if (!a || !b) return;
  var x1 = a.x + BOXW, y1 = a.y + BOXH / 2, x2 = b.x, y2 = b.y + BOXH / 2;
  if (b.x < a.x) { x1 = a.x; x2 = b.x + BOXW; }
  var mx = (x1 + x2) / 2;
  var p = el("path", { class: "edge", d: "M" + x1 + " " + y1 + " C" + mx + " " + y1 + " " + mx + " " + y2 + " " + x2 + " " + y2 });
  p.appendChild(el("title")).textContent = a.id + " — " + (D.relationLabel[e.rel] || e.rel) + " → " + b.id;
  gEdges.appendChild(p);
  edgeEls.push({ el: p, e: e });
});

var nodeEls = {};
D.nodes.forEach(function (n) {
  var g = el("g", { class: "node", transform: "translate(" + n.x + "," + n.y + ")", tabindex: "0", role: "button" });
  g.appendChild(el("rect", { width: BOXW, height: BOXH, rx: 6, fill: COLORS[n.kind] || "#888", "fill-opacity": ".16" }));
  var t1 = el("text", { x: 8, y: 13 }); t1.textContent = clip(n.id, 26); g.appendChild(t1);
  var t2 = el("text", { x: 8, y: 25, class: "sub" }); t2.textContent = clip(sub(n), 34); g.appendChild(t2);
  g.appendChild(el("title")).textContent = sub(n) ? n.id + " — " + n.title : n.id;
  g.addEventListener("click", function () { select(n.id); });
  g.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(n.id); } });
  gNodes.appendChild(g);
  nodeEls[n.id] = g;
});

// ── pan and zoom ──
var tx = 0, ty = 0, scale = 1;
function apply() { view.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")"); }
var canvas = document.getElementById("canvas"), dragging = false, px = 0, py = 0;
canvas.addEventListener("mousedown", function (e) { dragging = true; px = e.clientX; py = e.clientY; canvas.classList.add("drag"); });
window.addEventListener("mouseup", function () { dragging = false; canvas.classList.remove("drag"); });
window.addEventListener("mousemove", function (e) { if (!dragging) return; tx += e.clientX - px; ty += e.clientY - py; px = e.clientX; py = e.clientY; apply(); });
canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  var r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  var f = e.deltaY < 0 ? 1.12 : 1 / 1.12, ns = Math.min(2.5, Math.max(0.12, scale * f));
  tx = mx - (mx - tx) * (ns / scale); ty = my - (my - ty) * (ns / scale); scale = ns; apply();
}, { passive: false });
// fit on load, so a large graph does not open scrolled to a corner
(function fit() {
  var w = kinds.length * COLW + 40;
  var h = Math.max.apply(null, kinds.map(function (c) { return c.nodes.length; }).concat([1])) * ROWH + TOP + 20;
  var r = canvas.getBoundingClientRect();
  scale = Math.min(1, Math.max(0.12, Math.min(r.width / w, r.height / h)));
  tx = (r.width - w * scale) / 2; ty = (r.height - h * scale) / 2; apply();
})();

// ── selection and panel ──
//
// EVERY string below reaches the page through textContent, never through innerHTML, and that is a
// correctness rule rather than a style preference. The data island escapes the less-than sign only
// to keep a rule statement from closing the script element early — JSON.parse hands the original
// character straight back, so a statement, a question, or an OCR'd source path containing markup
// would be PARSED if it were assigned as HTML. The sources array holds pasted chat and text pulled
// out of customer screenshots: treating that as trusted markup because "we wrote the spec
// ourselves" is exactly the assumption that fails.
var detail = document.getElementById("detail"), current = null;
function tag(name, cls, txt) {
  var e = document.createElement(name);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function neighbours(id) {
  var outs = [], ins = [];
  D.edges.forEach(function (e) {
    if (e.from === id && byId[e.to]) outs.push(e);
    if (e.to === id && byId[e.from]) ins.push(e);
  });
  return { outs: outs, ins: ins };
}
function relBlock(dl, title, list, pick) {
  if (!list.length) return;
  dl.appendChild(tag("dt", null, title));
  var dd = tag("dd");
  list.forEach(function (e) {
    var other = byId[pick(e)];
    var lbl = (D.relationLabel[e.rel] || e.rel) + " → " + other.id + (sub(other) ? " · " + clip(sub(other), 40) : "");
    var b = tag("button", "rel", lbl);
    b.setAttribute("data-go", other.id);
    dd.appendChild(b);
  });
  dl.appendChild(dd);
}
function select(id) {
  current = id;
  var n = byId[id], nb = neighbours(id);
  detail.replaceChildren();
  detail.appendChild(tag("div", "id", n.id + " · " + (D.kindLabel[n.kind] || n.kind)));
  detail.appendChild(tag("h3", null, n.title));
  var dl = tag("dl");
  n.detail.forEach(function (kv) {
    dl.appendChild(tag("dt", null, kv[0]));
    dl.appendChild(tag("dd", null, kv[1]));
  });
  relBlock(dl, "ชี้ออกไปหา", nb.outs, function (e) { return e.to; });
  relBlock(dl, "มีอะไรชี้เข้ามา", nb.ins, function (e) { return e.from; });
  detail.appendChild(dl);
  if (n.page) {
    var a = tag("a", "page", "เปิดหน้าเต็มของโหนดนี้ →");
    a.setAttribute("href", n.page);
    detail.appendChild(a);
  } else {
    detail.appendChild(tag("p", "note", "ชนิดนี้ยังไม่มีหน้าใน bundle"));
  }
  var hot = {};
  nb.outs.concat(nb.ins).forEach(function (e) { hot[e.from] = 1; hot[e.to] = 1; });
  Object.keys(nodeEls).forEach(function (k) {
    nodeEls[k].classList.toggle("dim", !hot[k] && k !== id);
    nodeEls[k].classList.toggle("sel", k === id);
  });
  edgeEls.forEach(function (x) {
    var on = x.e.from === id || x.e.to === id;
    x.el.classList.toggle("hot", on);
    x.el.classList.toggle("dim", !on);
  });
}
detail.addEventListener("click", function (e) {
  var go = e.target.getAttribute && e.target.getAttribute("data-go");
  if (go) select(go);
});
function clearSel() {
  current = null;
  detail.replaceChildren(tag("p", "empty", "คลิกโหนดสักตัวเพื่อดูข้อมูลของมัน"));
  Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove("dim", "sel"); });
  edgeEls.forEach(function (x) { x.el.classList.remove("hot", "dim"); });
}
svg.addEventListener("click", function (e) { if (e.target === svg || e.target === view) clearSel(); });

// ── legend filter ──
var off = {}, legend = document.getElementById("legend");
kinds.forEach(function (col) {
  var b = document.createElement("button");
  b.setAttribute("aria-pressed", "true");
  var dot = tag("span", "dot");
  dot.style.background = COLORS[col.kind] || "#888";
  b.appendChild(dot);
  b.appendChild(tag("span", null, D.kindLabel[col.kind] || col.kind));
  b.appendChild(tag("span", "n", String(col.nodes.length)));
  b.addEventListener("click", function () {
    off[col.kind] = !off[col.kind];
    b.setAttribute("aria-pressed", off[col.kind] ? "false" : "true");
    col.nodes.forEach(function (n) { nodeEls[n.id].style.display = off[col.kind] ? "none" : ""; });
    edgeEls.forEach(function (x) {
      var a = byId[x.e.from], c = byId[x.e.to];
      x.el.style.display = off[a.kind] || off[c.kind] ? "none" : "";
    });
  });
  legend.appendChild(b);
});

// ── search ──
document.getElementById("search").addEventListener("input", function (e) {
  var q = e.target.value.trim().toLowerCase();
  if (!q) { Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove("dim"); }); if (current) select(current); return; }
  D.nodes.forEach(function (n) {
    var hay = (n.id + " " + n.title + " " + n.detail.map(function (kv) { return kv[1]; }).join(" ")).toLowerCase();
    nodeEls[n.id].classList.toggle("dim", hay.indexOf(q) === -1);
  });
});

var s = D.summary, sum = document.getElementById("sum");
sum.appendChild(document.createTextNode("กฎที่ใช้อยู่ " + s.rules + " · มีตัวอย่าง " + s.withExample + " · การ์ดแดงเปิด "));
sum.appendChild(s.openRed ? tag("span", "warn", String(s.openRed)) : document.createTextNode("0"));
sum.appendChild(document.createTextNode(
  " · เลื่อนไป CP2 " + s.openDeferred + " · " + (s.ready ? "CP1 ครบ" : "CP1 ยังไม่ครบ") +
  " · " + D.nodes.length + " โหนด " + D.edges.length + " เส้น"));

// ── the spine, the directive, and the status list ──
// All three read D.sections / D.next. The page never decides what "done" means; the renderer
// handed it a verdict and this only draws it. Text goes in via textContent, never innerHTML —
// every one of these strings can contain characters a person typed into spec.json.
var spine = document.getElementById("spine");
var secList = document.getElementById("sections");
var nextNo = D.next ? D.next.no : null;

D.sections.forEach(function (sec) {
  var b = document.createElement("button");
  b.className = "seg st-" + sec.state;
  b.type = "button";
  if (sec.no === nextNo) b.setAttribute("aria-current", "true");
  b.appendChild(tag("span", "bar"));
  b.appendChild(tag("span", "no", sec.icon + " " + sec.no + ". " + sec.title));
  b.title = sec.stateLabel + " — " + sec.detail + (sec.next ? "  ต่อไป: " + sec.next : "");
  b.addEventListener("click", function () {
    var row = document.getElementById("sec-" + sec.no);
    if (row) row.scrollIntoView({ block: "nearest" });
  });
  spine.appendChild(b);

  var r = document.createElement("div");
  r.className = "sec st-" + sec.state;
  r.id = "sec-" + sec.no;
  r.appendChild(tag("span", "pip"));
  var body = document.createElement("div");
  body.appendChild(tag("div", "t", sec.no + ". " + sec.title));
  body.appendChild(tag("div", "d", sec.stateLabel + " — " + sec.detail));
  if (sec.next) body.appendChild(tag("code", "cmd", sec.next));
  r.appendChild(body);
  secList.appendChild(r);
});

// One directive, always present. When nothing is outstanding it says so AND says what that does
// not mean — a page that printed only "เสร็จแล้ว" would be handing over the approval this whole
// command refuses to give. The gate is /req:check; the signature is a person's.
var dir = document.getElementById("directive");
var dbody = document.createElement("div");
if (D.next) {
  dbody.appendChild(tag("div", "lead", "ทำต่อที่"));
  dbody.appendChild(tag("code", null, D.next.command));
  dbody.appendChild(tag("div", "why", "หัวข้อ " + D.next.no + " · " + D.next.title + " — " + D.next.why));
} else {
  dir.className = "directive ok";
  dbody.appendChild(tag("div", "lead", "ไม่มีหัวข้อไหนค้าง"));
  dbody.appendChild(tag("div", "why",
    "ทุกหัวข้อเต็มแล้ว — แต่ครบทุกหัวข้อไม่เท่ากับได้รับอนุมัติ ด่านคือ /req:check และคนที่เซ็น CP1 คือเจ้าของ (/req:approve)"));
}
dir.appendChild(dbody);

clearSel();
</script>
</body>
</html>
