# Angular is a single-page app: the router owns every path below "/", but nginx only knows the one
# file the build emitted. Without try_files, typing /applications or pressing refresh on it asks
# nginx for a file that was never written and gets a 404 — the bundle never loads, so the router
# never sees the URL. Serving index.html for any path that is not a real file hands the URL to the
# router instead, which is what makes all 14 screens reachable by address (and what makes
# /adjustments and /settings/approver-role reachable at all — nav.component.ts links to neither,
# because sitemap.json marks both entry:false).
#
# Real files still win: $uri is tried first, so the hashed JS/CSS chunks and assets are served as
# themselves and only unmatched paths fall through to the app.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
