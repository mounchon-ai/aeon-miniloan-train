<nav class="app-nav" aria-label="เมนูหลัก">
  <ul class="app-nav__links">
    @for (entry of entries(); track entry.screen) {
      <li>
        <a
          [routerLink]="entry.path"
          routerLinkActive="is-active"
          [attr.data-testid]="navTestId(entry.screen)"
          >{{ entry.label }}</a
        >
      </li>
    }
  </ul>

  <label class="app-nav__role-switcher">
    <span>บทบาท (ทดลอง)</span>
    <!--
      [selected] on the option, not [value] on the select: Angular writes select.value in the same
      change-detection pass that @for is still creating the options, so a value naming an option
      that does not exist yet is dropped and the box falls back to the first entry. That was
      invisible while the role reset to ROLE-001 on every load; once the role survives a reload
      (CurrentRoleService) the box would have read the wrong name while the menu and the token
      said otherwise.
    -->
    <select (change)="onRoleChange($any($event.target).value)">
      @for (r of roles; track r.id) {
        <option [value]="r.id" [selected]="r.id === role().id">{{ r.label }}</option>
      }
    </select>
  </label>
</nav>
